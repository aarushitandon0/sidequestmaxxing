# Render Blueprint — MASTERSPEC §12.2.
#
# TEMPORARY, DEMO ONLY (D-98): `sqm-api` is suspended because Render asks for a card, which the
# owner cannot add until 2026-11-01. Until then the API runs on the owner's machine behind a
# Cloudflare Quick Tunnel, and VITE_API_BASE_URL plus the CSP connect-src below point at that
# tunnel instead of https://sqm-api.onrender.com. Consequences, so nobody is surprised:
#   * The site works only while that laptop runs both the API and `cloudflared`.
#   * A quick-tunnel URL is random and changes on every restart, so each restart needs this
#     file updated and pushed again (a ~2 min static rebuild).
# TO REVERT once sqm-api is resumed: put https://sqm-api.onrender.com back in both places. Field names checked 2026-10-07 against Render's
# official blueprint skill (render-oss/skills). Validate with: render blueprints validate
# Plan values follow the free path (D-97): `sqm-api` runs on Render's free instance and
# `sqm-llm` is not deployed at all. See the commented block at the end of this file for why,
# and for how to bring the LLM back. Changing a plan costs money — state the cost and ask.
services:
  - type: web
    name: sqm-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: ./apps/web/dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), geolocation=(self), microphone=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      # CSP allow-lists exactly what the built bundle loads (D-65). Everything but the map
      # tiles, the API and Sentry is self-hosted: fonts (public/fonts), the MediaPipe WASM
      # (/mediapipe-wasm, needs 'wasm-unsafe-eval'), demo audio, the SW and the manifest.
      # 'unsafe-inline' is in style-src only — Leaflet sets element styles at runtime; no
      # script-src exception is needed because Vite emits no inline script.
      # Verified against a real `npm run build` in Chromium: 0 CSP violations across
      # Story/Home/Quest/Walk/Chronicle/Settings (apps/web: npm run check:csp).
      # After the first deploy: replace the sqm-api host below with the real one, and if you
      # set VITE_GEMMA_MODEL_URL, add its host to connect-src or the download is blocked.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none';
          form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'
          'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org;
          font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:;
          manifest-src 'self'; connect-src 'self' https://alexandria-miscellaneous-jumping-lawsuit.trycloudflare.com
          https://*.ingest.sentry.io https://*.ingest.us.sentry.io
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://alexandria-miscellaneous-jumping-lawsuit.trycloudflare.com  # TEMPORARY, see the header (D-98)
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_GEMMA_MODEL_URL
        sync: false

  - type: web
    name: sqm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Free instance: 512 MB RAM / 0.1 CPU, 750 instance-hours per workspace per calendar
    # month, spins down after 15 min without traffic and takes ~1 min to wake. The API fits:
    # it has no heavy ML dependency and loads no model in-process (`embedding_model` is named
    # in config but unused by `app/`), and it needs no persistent disk — which is the point,
    # because free services cannot attach one.
    # The cold start is the one demo risk: a judge arriving at an idle service waits ~1 min and
    # reads it as broken. 750 hours only just covers the ~720 an always-on month needs, so a
    # keep-warm ping buys availability at the cost of the whole monthly allowance.
    # Moving to `plan: starter` ($7/mo, always-on) removes both problems — ask first.
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: WEB_ORIGIN
        value: https://sqm-web.onrender.com  # replace with the real URL after first deploy
      # Deliberately no LLM_HOSTPORT and no LLM_BASE_URL on the free path. `Settings.llm_url`
      # then resolves to None (app/config.py), `deps.py` builds no LLMClient, and every quest
      # comes from the fallback engine — which MASTERSPEC §2.4 and CLAUDE.md invariant 5 already
      # require to work with the LLM down. /healthz reports the LLM as unknown; that behaviour is
      # covered by tests/test_places.py::test_healthz_reports_unknown_when_unconfigured.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sqm
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # One voice per Dungeon Master. These are ElevenLabs' shared default voices, so the ids
      # are public identifiers, not secrets — checked in so the blueprint stays reproducible.
      # Each falls back to ELEVENLABS_VOICE_ID above when blank. Verified against the live TTS
      # API on 2026-10-11 (docs/DECISIONS.md D-99).
      - key: ELEVENLABS_VOICE_ID_CHILL
        value: EXAVITQu4vr4xnSDxMaL
      - key: ELEVENLABS_VOICE_ID_DRAMATIC
        value: JBFqnCBsd6RMkjVDRZzb
      - key: ELEVENLABS_VOICE_ID_NATURE_NERD
        value: pFZP5JQG7iQjIQuC4Bku
      - key: ELEVENLABS_VOICE_ID_SARCASTIC
        value: IKne3meq5aSn9XLyUdCD
      - key: SENTRY_DSN
        sync: false
      - key: TTS_DAILY_CHAR_BUDGET
        value: "20000"
      - key: FALLBACK_ON_LLM_ERROR
        value: "true"

# sqm-llm is NOT deployed on the free path, and cannot be: per Render's blueprint reference the
# free plan is not available for private services, and no free service may attach a disk — this
# service is a `pserv` that needs a 10 GB disk for the GGUF. Nothing is lost today, because P17
# has never run, so no GGUF exists for it to serve (DECISIONS D-60/D-97) and the fallback engine
# serves quests meanwhile.
