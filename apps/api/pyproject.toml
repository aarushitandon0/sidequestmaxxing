[project]
name = "sqm-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF001", "RUF003", "E501"]
"app/validators/text.py" = ["RUF001", "RUF003"]  # confusables table is intentional
"app/validators/lint.py" = ["E501"]  # long regexes read better on one line
"app/agents/templates.py" = ["E501"]  # the template table reads better as aligned rows
"app/agents/fallback_engine.py" = ["S311"]  # seeded RNG is for variety, not security

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "fastembed.*", "pygeohash.*"]
ignore_missing_imports = true
