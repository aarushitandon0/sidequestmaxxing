# Same rules as the API; `app` (apps/api, put on sys.path by common.py) must sort AFTER the
# training modules, because importing `common` is what makes `app` importable.
extend = "../apps/api/pyproject.toml"

[lint.isort]
known-first-party = ["common", "records", "prompts_extra", "embed", "make_contexts", "gen_teacher",
                     "filter", "make_recap_examples", "tinker_backend", "dump_places", "train_sft",
                     "eval_harness", "llm_eval", "eval"]
known-local-folder = ["app"]

[lint.per-file-ignores]
"tests/**" = ["S", "RUF001", "RUF003", "E501"]
